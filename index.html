<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Demo Product</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .hero {
      text-align: center;
      padding: 60px 40px;
      max-width: 700px;
    }
    h1 { font-size: 3rem; margin-bottom: 20px; }
    p { font-size: 1.2rem; margin-bottom: 40px; opacity: 0.9; }
    .cta-group {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .btn {
      padding: 16px 36px;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn:hover { transform: translateY(-2px); opacity: 0.9; }
    .btn-primary { background: white; color: #764ba2; }
    .btn-secondary {
      background: transparent;
      color: white;
      border: 2px solid white;
    }
    .features {
      margin-top: 20px;
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .features-card {
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 24px;
      width: 180px;
      backdrop-filter: blur(10px);
    }
    .features-card h3 { margin-bottom: 8px; }
    .features-card p { font-size: 0.9rem; opacity: 0.85; }
  </style>
</head>
<body>

  <div class="hero">
    <h1>Build Faster. Ship Smarter.</h1>
    <p>The all-in-one platform that helps teams track, analyze, and grow.</p>

    <!-- ✅ BUTTONS ARE HERE -->
    <div class="cta-group">
      <button class="btn btn-primary" id="signupBtn">Sign Up Free</button>
      <button class="btn btn-secondary" id="demoBtn">Request Demo</button>
    </div>

    <div class="features">
      <div class="features-card">
        <h3>Analytics</h3>
        <p>Real-time insights for your product</p>
      </div>
      <div class="features-card">
        <h3>Funnels</h3>
        <p>Track every step of the user journey</p>
      </div>
      <div class="features-card">
        <h3>Cohorts</h3>
        <p>Segment users by behavior</p>
      </div>
    </div>
  </div>

  <!--  AMPLITUDE SDK -->
  <script type="text/javascript">
    !function(){"use strict";!function(e,t){var r=e.amplitude||{_q:[],_iq:{}};if(r.invoked)e.console&&console.error&&console.error("Amplitude snippet has been loaded.");else{r.invoked=!0;var n=t.createElement("script");n.type="text/javascript";n.async=!0;n.src="https://cdn.amplitude.com/libs/analytics-browser-2.11.1-min.js.gz";n.onload=function(){e.amplitude.runQueuedFunctions||console.log("[Amplitude] Error: could not load SDK")};var s=t.getElementsByTagName("script")[0];s.parentNode.insertBefore(n,s);r.init=function(e,t,n){r._q.unshift({name:"init",args:[e,t,n]})};r.track=function(e,t){r._q.push({name:"track",args:[e,t]})};e.amplitude=r}}(window,document)}();

    //  Your API Key is already in here
    amplitude.init("1d381d1afd8ba64a8899f1d2ff019505", {
      defaultTracking: true
    });

    //  Track Sign Up button
    document.getElementById("signupBtn").addEventListener("click", function() {
      amplitude.track("CTA Clicked", {
        button_name: "Sign Up Free",
        button_type: "primary",
        page: "landing_page"
      });
      alert("Thanks for signing up! (Demo)");
    });

    // Track Request Demo button
    document.getElementById("demoBtn").addEventListener("click", function() {
      amplitude.track("CTA Clicked", {
        button_name: "Request Demo",
        button_type: "secondary",
        page: "landing_page"
      });
      alert("Demo request received! (Demo)");
    });
  </script>

</body>
</html>
