<!DOCTYPE html >
<html lang="en">
  <head>
      <meta cahrset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>MY Demo Product</title>
    <style>
      * {margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Segoe UI', Arial;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }
      .hero {
        text-align: center;
        padding: 60px 40px;
        max-width: 700px;
      }
      h1 { font-size: 3rem; margin-bottom: 20px; }
      p { font-size: 1.2rem; margin-bottom: 40px; opacity: 0.9; }
      .cta-group { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
      .btn {
        padding: 16px 36px;
        font-size: 1.1rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: transform 0.2s, opacity 0.2s;
      }
      .btn:hover { transform:translateY(-2px); opacity: 0.9; }
      .btn-primary { background: white; color: #764ba2; }
      .btn-secondary {
        background: transparent;
        color: white;
        border: 2px solid white;
      }
      .features {
        margin-top: 60px;
        display: flex;
        gap: 30px
        justify-content: center;
        flex-wrap: wrap;
      }
      .features-card {
        background: rgba(255,255,2555,0.15);
        border-radius: 12px;
        padding: 24px;
        width: 180px;
        backdrop-filter: blur(10px);
      }
      .features-card h3 { margin-bottom: 8px; }
      .features-card p {font-size: 0.9rem; opacity: 0.85; }
    </style>
  </head>
  <body>

    <div class ="hero">
      <h1>Build Faster. Ship Smarter.</h1>
      <p> The all-in-one platform that helps teams track, analyze, and grow.</p>

      <div class="features">
        <div class ="features-card">
          <h3>Analytics</h3>
          <p>Real-time insights for your product</p>
        </div>
        <div class ="features-card">
          <h3>Cohorts</h3>
          <p>Segment users by behavior</p>
        </div>
      </div>
    </div>
